services:
  - type: web
    name: club-digital-pro-backend
    env: node
    buildCommand: npm install && npm run build:shared && npm run build:backend && npm --prefix backend run prisma:generate
    startCommand: npm --prefix backend start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
